services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    networks:
      - web

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - web

networks:
  web:
